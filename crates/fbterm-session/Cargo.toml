[package]
name = "fbterm-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fbterm-config = { path = "../fbterm-config" }
fbterm-term = { path = "../fbterm-term" }
portable-pty = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
fbterm-secrets = { path = "../fbterm-secrets" }
russh = { workspace = true }
async-trait = { workspace = true }
# known_hosts: hashed host names are HMAC-SHA1 with base64 salts (same versions as russh).
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"

[dev-dependencies]
tempfile = "3"
alacritty_terminal = { workspace = true }
