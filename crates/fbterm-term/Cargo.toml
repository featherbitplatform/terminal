[package]
name = "fbterm-term"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Reads GSUB and glyph bounds for ligature-only stylistic sets; the version cosmic-text already
# uses (through swash).
skrifa = "0.44"
iced = { workspace = true, features = ["advanced"] }
feathercritty = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
flate2 = { workspace = true }
# Image store decoders and resampler (`src/images`).
png = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
gif = { workspace = true }
fast_image_resize = { workspace = true }
fbterm-config = { path = "../fbterm-config" }

# Lowers the history worker thread's priority (`history_worker::lower_priority`).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
iced = { workspace = true, features = ["wgpu", "tokio", "advanced"] }
portable-pty = { workspace = true }
serde_json = { workspace = true }
# Encodes the checked-in JPEG fixture.
jpeg-encoder = { workspace = true }
