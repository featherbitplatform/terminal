[package]
name = "fbterm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fbterm-config = { path = "../fbterm-config" }
fbterm-secrets = { path = "../fbterm-secrets" }
fbterm-session = { path = "../fbterm-session" }
fbterm-term = { path = "../fbterm-term" }
iced = { workspace = true, features = ["tokio", "advanced", "svg"] }
nucleo-matcher = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
rfd = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Only for the FBTERM_SCREENSHOT debug aid.
png = { workspace = true }

[dev-dependencies]
alacritty_terminal = { workspace = true }
toml = { workspace = true }

# Window occlusion (see `visibility.rs`): the same versions iced's windowing already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
