[package]
name = "fbterm-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fbterm-config = { path = "../fbterm-config" }
# Default `v1` feature selects macOS Keychain, Windows Credential Manager and
# the Linux Secret Service (zbus, pure Rust) stores.
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
age.workspace = true
zeroize.workspace = true
base64.workspace = true
toml.workspace = true

[features]
# `archive::open_plaintext` for tests in other crates that search a decrypted archive; the
# app never enables it.
test-support = []

[dev-dependencies]
uuid.workspace = true
tempfile = "3"
