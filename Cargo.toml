[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
iced = "0.14.0"
# Terminal emulation (our fork, see LICENSES.md). Change it in the feathercritty repo, then bump the rev.
feathercritty = { git = "https://github.com/featherbitplatform/feathercritty", rev = "6cde6ce7792c84a1478705f907b41a396f06eb6c" }
russh = { version = "0.65.0", default-features = false, features = ["flate2", "ring", "rsa"] }
# SFTP client over a russh channel stream (it does not depend on russh itself).
russh-sftp = "3.0.1"
portable-pty = "0.9.0"
keyring = "4.2.0"
# DPAPI for the Windows system storage; the version tokio, tempfile and others already use.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
nucleo-matcher = "0.3.1"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Same major as the one `toml` uses; edits settings.toml in place.
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde_json = "1"
parking_lot = "0.12"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std", "tracing-log"] }
png = "0.17"
# Image store decoders (`fbterm-term/src/images`): JPEG and GIF (first frame), pure Rust, no C.
zune-jpeg = "0.5"
# The options and byte-stream types `zune-jpeg` takes; used directly to ask for RGBA output.
zune-core = "0.5"
gif = "0.14"
# Resampling decoded images to cell sizes; runtime-detected SIMD, pure Rust fallback.
fast_image_resize = "6"
# Reference-counted pixel buffers (`fbterm-term`'s `Rgba8Image`): a copy at a picture's own size
# shares the source's bytes, and with them iced's one texture for those pixels. Already in the
# tree through tokio.
bytes = "1"
# Encodes the JPEG test fixture (`fbterm-term` tests); dev-only, never shipped.
jpeg-encoder = "0.7"
rfd = "0.17.2"
# Tab export: gzip output, and the local time in the default file name.
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Profile archives and the vault: passphrase (scrypt) encryption only, no other recipients.
# 0.12 needs a prerelease `kem` 0.3 API while russh needs the released one; Cargo allows only one.
age = { version = "0.11.5", default-features = false }
# Wipes secret buffers (archive plaintext, archived secrets and key files) when dropped.
zeroize = { version = "1.9.1", features = ["serde"] }
# Key file bytes inside the archive TOML.
base64 = "0.22.1"
# The update check's HTTPS GET (`fbterm/src/net.rs`): rustls with ring (already here through
# russh) and the bundled webpki roots, so no OpenSSL or other system library is linked.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# Comparing release versions for the update check (already in the lockfile through rustc_version).
semver = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Our winit fork (see LICENSES.md and the fork's FORK.md): 0.30.13 plus a backport of upstream's
# Windows 11 WM_DPICHANGED fix (rust-windowing/winit#4041). Change it in the fork, then bump the
# rev; drop the patch once iced uses a winit release that has the fix.
[patch.crates-io]
winit = { git = "https://github.com/featherbitplatform/winit", rev = "1db366a512f082cb91d93cd95960ba800f9d52c7" }
