[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
iced = "0.14.0"
alacritty_terminal = "0.26.0"
russh = "0.64.1"
portable-pty = "0.9.0"
keyring = "4.2.0"
nucleo-matcher = "0.3.1"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde_json = "1"
parking_lot = "0.12"
async-trait = "0.1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
