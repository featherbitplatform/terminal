[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored, patched dependencies are not workspace members (not formatted or linted here).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
iced = "0.14.0"
alacritty_terminal = "0.26.0"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
portable-pty = "0.9.0"
keyring = "4.2.0"
nucleo-matcher = "0.3.1"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Same major as the one `toml` uses; edits settings.toml in place.
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde_json = "1"
parking_lot = "0.12"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
png = "0.17"
rfd = "0.17.2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[profile.release]
lto = "thin"
codegen-units = 1

# alacritty_terminal 0.26.0 with two small patches; see vendor/alacritty_terminal/FBTERM_PATCHES.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
