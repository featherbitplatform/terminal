[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
iced = "0.14.0"
# Terminal emulation (our fork, see LICENSES.md). Change it in the feathercritty repo, then bump the rev.
feathercritty = { git = "https://github.com/featherbitplatform/feathercritty", rev = "3c290b8c1f0c89b6e726c27e1f5eb15fb08742be" }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
# SFTP client over a russh channel stream (it does not depend on russh itself).
russh-sftp = "3.0.1"
portable-pty = "0.9.0"
keyring = "4.2.0"
# DPAPI for the Windows system storage; the version tokio, tempfile and others already use.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
nucleo-matcher = "0.3.1"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Same major as the one `toml` uses; edits settings.toml in place.
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde_json = "1"
parking_lot = "0.12"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
png = "0.17"
rfd = "0.17.2"
# Tab export: gzip output, and the local time in the default file name.
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Profile archives and the vault: passphrase (scrypt) encryption only, no other recipients.
# 0.12 needs a prerelease `kem` 0.3 API while russh needs the released one; Cargo allows only one.
age = { version = "0.11.5", default-features = false }
# Wipes secret buffers (archive plaintext, archived secrets and key files) when dropped.
zeroize = { version = "1.9.1", features = ["serde"] }
# Key file bytes inside the archive TOML.
base64 = "0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
