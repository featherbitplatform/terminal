[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    # clipboard-win and error-code (iced_winit on Windows)
    "BSL-1.0",
    # hexf-parse (naga, via wgpu) and notify (file watching)
    "CC0-1.0",
    # webpki-roots (Mozilla's root certificates as data, for the update check over ureq)
    "CDLA-Permissive-2.0",
]

[advisories]
version = 2
# Unmaintained notices only for crates we depend on directly; transitive ones (iced, wgpu,
# cosmic-text stack) are outside our control. Vulnerabilities still fail at any depth.
unmaintained = "workspace"
ignore = [
    # Marvin attack (timing side channel in RSA private-key operations) in the `rsa` crate, via
    # russh's `rsa` feature; no fixed release exists. Kept so RSA host keys verify and RSA user
    # keys work. Exposure is limited to signing the auth request with a local RSA user key once
    # per connection, which gives a network observer one timing sample per login.
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; RSA user/host keys needed, see comment" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# feathercritty, our terminal emulation library, comes from its git repository (see LICENSES.md).
allow-org = { github = ["featherbitplatform"] }
