[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    # clipboard-win and error-code (iced_winit on Windows)
    "BSL-1.0",
    # hexf-parse (naga, via wgpu)
    "CC0-1.0",
]

[advisories]
version = 2
# Unmaintained notices only for crates we depend on directly; transitive ones (iced, wgpu,
# cosmic-text stack) are outside our control. Vulnerabilities still fail at any depth.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
