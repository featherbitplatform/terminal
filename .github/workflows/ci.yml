name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The ConPTY passthrough check runs only against the bundled, pinned ConPTY: portable-pty
      # sideloads a conpty.dll sitting next to its own executable (`win/psuedocon.rs`), and
      # crates/fbterm-session/tests/conpty_passthrough.rs refuses to run without one rather than
      # silently measuring the system console layer; it also hardens its DLL search exactly as
      # fbterm's main does and reports which conpty.dll was really loaded. The test exe is copied
      # into a folder under the runner's temporary directory (outside target, so never part of what
      # rust-cache caches: staged DLLs here cannot leak into later cargo test runs) together with
      # the files dev/fetch-conpty.ps1 stages, and that copy runs - so only the app-dir search can
      # find the staged pair. The step then insists
      # on a real result line, on the line naming the conpty.dll that was really loaded, and on each
      # of the lines the test prints about its sequences, so a renamed test or a skipped gate cannot
      # pass vacuously. `--nocapture` because a passing run's own evidence stays behind libtest's
      # capture.
      - name: ConPTY passthrough (bundled)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = cargo test -p fbterm-session --test conpty_passthrough --no-run --message-format=json
          $exe = ''
          foreach ($line in $lines) {
            if (-not $line.StartsWith('{')) { continue }
            $msg = $line | ConvertFrom-Json
            if ($msg.reason -eq 'compiler-artifact' -and $msg.target.kind -contains 'test' -and $msg.target.name -eq 'conpty_passthrough' -and $msg.executable) {
              $exe = $msg.executable
            }
          }
          if (-not $exe) { throw 'cargo test --no-run did not report the conpty_passthrough executable' }
          # A folder under RUNNER_TEMP, emptied first: it sits outside target, so rust-cache never
          # caches it and a staged conpty.dll here cannot put later portable-pty tests under the
          # bundled host on cache hits. The staged files go beside the copied exe and nothing else
          # does, so the run proves the app-dir search alone (the exe hardens its own DLL search,
          # as fbterm's main does).
          $stage = Join-Path $env:RUNNER_TEMP 'conpty-test'
          if (Test-Path -LiteralPath $stage) { Remove-Item -Recurse -Force -LiteralPath $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $copy = Join-Path $stage (Split-Path -Leaf $exe)
          Copy-Item -LiteralPath $exe -Destination $copy
          ./dev/fetch-conpty.ps1 -OutDir $stage
          # A Rust test binary needs no sibling DLLs; if this build ever did, the copied exe would
          # fail to start and this line says so before the test itself starts.
          & $copy --list 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the copied test exe exited with $LASTEXITCODE running --list" }
          $env:FBTERM_TEST_CONPTY = '1'
          # Tee keeps the run's own lines in the job log and also collects them, so the checks below
          # can prove a real result rather than just a zero exit code.
          & $copy --exact image_sequences_pass_through_conpty --nocapture --test-threads=1 2>&1 |
            Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw "conpty_passthrough exited with $LASTEXITCODE" }
          if (-not ($out -match '^test result: ok\. 1 passed')) {
            throw 'the step passed without the test reporting one real pass (a renamed or gated-off test exits 0)'
          }
          foreach ($name in @('bundled ConPTY:', 'loaded conpty.dll from', 'kitty APC: unchanged', 'sixel DCS: unchanged', 'OSC 1337: unchanged')) {
            if (-not ($out | Where-Object { $_ -like "*$name*" })) {
              throw "the test output has no line about '$name'; the check did not report what it measured"
            }
          }

  # cargo-deny runs in security.yml (job cargo-deny), which also re-scans weekly.

  ssh-live:
    name: ssh live tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Start test sshd containers
        run: docker compose -f dev/ssh-test/compose.yaml up -d
      - name: Wait for sshd on port 2222
        run: dev/ssh-test/wait-ready.sh
      - name: Live SSH tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm-session --test ssh_live
      - name: Live tunnel tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm-session --test ssh_tunnels
      - name: Live SFTP tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm-session --test ssh_sftp
      - name: Live file panel tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm file_panel::live_tests
      - name: Container logs
        if: failure()
        run: docker compose -f dev/ssh-test/compose.yaml logs
      - name: Stop test sshd containers
        if: always()
        run: docker compose -f dev/ssh-test/compose.yaml down
