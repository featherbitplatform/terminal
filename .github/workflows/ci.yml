name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # cargo-deny runs in security.yml (job cargo-deny), which also re-scans weekly.

  ssh-live:
    name: ssh live tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Start test sshd containers
        run: docker compose -f dev/ssh-test/compose.yaml up -d
      - name: Wait for sshd on port 2222
        run: dev/ssh-test/wait-ready.sh
      - name: Live SSH tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm-session --test ssh_live
      - name: Live tunnel tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm-session --test ssh_tunnels
      - name: Live SFTP tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm-session --test ssh_sftp
      - name: Live file panel tests
        run: FBTERM_TEST_SSH=1 cargo test -p fbterm file_panel::live_tests
      - name: Container logs
        if: failure()
        run: docker compose -f dev/ssh-test/compose.yaml logs
      - name: Stop test sshd containers
        if: always()
        run: docker compose -f dev/ssh-test/compose.yaml down
