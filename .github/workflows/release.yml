name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  macos:
    name: unsigned universal macOS dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $cargo_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Package
        run: bash dev/package-macos.sh "${{ steps.version.outputs.version }}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/fbterm-${{ steps.version.outputs.version }}-macos-universal.dmg
            target/dist/fbterm-${{ steps.version.outputs.version }}-macos-universal.dmg.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
