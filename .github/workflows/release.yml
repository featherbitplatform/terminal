name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - dev/package-macos.sh
      - crates/fbterm/macos/**
      - dev/package-linux.sh
      - dev/make-linux-icons.sh
      - dev/smoke-linux.sh
      - crates/fbterm/linux/**
      - crates/fbterm/Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the publish job (tag pushes) gets write access.
permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: unsigned universal macOS dmg
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Resolve version
        id: version
        run: |
          cargo_version="$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match workspace version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Package
        run: bash dev/package-macos.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fbterm-macos-universal
          if-no-files-found: error
          path: |
            target/dist/fbterm-${{ steps.version.outputs.version }}-macos-universal.dmg
            target/dist/fbterm-${{ steps.version.outputs.version }}-macos-universal.dmg.sha256

  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # glibc 2.34 (RHEL 9's), the oldest of the supported systems, so the .deb and the .rpm
    # run on all of them (see dev/package-linux.sh).
    container: almalinux:9
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build tools
        run: dnf install -y gcc make pkgconf-pkg-config git tar gawk binutils xz rpm desktop-file-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
      - name: Install packaging tools
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: Resolve version
        id: version
        run: |
          cargo_version="$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match workspace version $cargo_version"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - name: Package
        run: bash dev/package-linux.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fbterm-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist/fbterm-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb
            target/dist/fbterm-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb.sha256
            target/dist/fbterm-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm
            target/dist/fbterm-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm.sha256
            target/dist/fbterm-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            target/dist/fbterm-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256

  linux-smoke:
    name: linux smoke ${{ matrix.arch }} ${{ matrix.target.format }} ${{ matrix.target.image }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        target:
          - { image: "debian:12", format: deb }
          - { image: "ubuntu:22.04", format: deb }
          - { image: "fedora:39", format: rpm }
          - { image: "rockylinux:9", format: rpm }
          - { image: "ubuntu:22.04", format: tar.gz }
          - { image: "fedora:39", format: tar.gz }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.target.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dev/smoke-linux.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: fbterm-linux-${{ matrix.arch }}
          path: dist
      - name: Install, run and remove
        run: bash dev/smoke-linux.sh "${{ matrix.target.format }}" dist "${{ needs.linux.outputs.version }}"

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deny, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fbterm-macos-universal
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fbterm-${{ needs.package.outputs.version }}-macos-universal.dmg
            dist/fbterm-${{ needs.package.outputs.version }}-macos-universal.dmg.sha256
          generate_release_notes: true
          prerelease: ${{ contains(needs.package.outputs.version, '-') }}
          fail_on_unmatched_files: true
